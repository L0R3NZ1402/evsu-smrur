<!-- Main Mobile Container -->
<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 text-slate-800">

    <!-- Mobile Card Wrapper -->
    <div
        class="w-full max-w-sm bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-100 p-6 space-y-6">

        <!-- Header Section -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Create Account</h1>
            <p class="text-xs text-slate-500">Please enter your details to register</p>
        </div>

        <!-- Registration Form -->
        <div class="space-y-5">

            <!-- Personal Details Group -->
            <div class="space-y-3">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Personal Information</h2>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="first-name">
                        First Name <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="first-name" placeholder="John"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="last-name">
                        Last Name <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="last-name" placeholder="Doe"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="department">
                        Department <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="department" placeholder="e.g. Information Technology Department"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                    <p class="text-[11px] text-slate-500 mt-1">Must be the complete name, not an abbreviation (e.g.,
                        Information Technology instead of IT).</p>
                </div>
            </div>

            <hr class="border-slate-100" />

            <!-- Signin Information Group -->
            <div class="space-y-3">
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Signin Information</h2>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="username">
                        Username <span class="text-rose-500">*</span>
                    </label>
                    <input type="text" id="username" placeholder="johndoe123"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="password">
                        Password <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" id="password" placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1" for="confirm-password">
                        Confirm Password <span class="text-rose-500">*</span>
                    </label>
                    <input type="password" id="confirm-password" placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 text-sm rounded-lg bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-150"
                        required />
                </div>
            </div>

            <!-- Submit Button -->
            <button type="button" id="signupBtn"
                class="w-full py-3 px-4 mt-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium text-sm rounded-lg shadow-md shadow-indigo-200 transition duration-150 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Sign Up
            </button>
        </div>

        <!-- Footer / Alternative Action -->
        <div class="text-center pt-2">
            <p class="text-xs text-slate-500">
                Already have an account?
                <a href="./?page=/signin" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">Sign in</a>
            </p>
        </div>

    </div>
</div>
