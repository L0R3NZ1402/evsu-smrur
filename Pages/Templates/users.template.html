<div id="containerParent" class="user-data" data-user="" data-status="">
    <div class="divide-y divide-slate-100">
    
        <!-- Single User Row Item -->
        <div class="bg-slate-50/30 transition-colors userItem border-b border-slate-100 last:border-b-0" id="userRow">
    
            <!-- Row Summary (Parent Data) -->
            <div
                class="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-4 px-5 py-4 items-center cursor-pointer hover:bg-slate-50/50 transition-colors">
    
                <!-- Name & User ID -->
                <div class="md:col-span-4 flex items-center gap-3">
                    <!-- 1st item: Avatar -->
                    <div id="user_avatar" class="w-8 h-8 rounded-xl border flex items-center justify-center font-bold text-xs shrink-0">
                        JD
                    </div>
    
                    <!-- 2nd item: User details -->
                    <div class="min-w-0 flex-1">
                        <h4 class="font-bold text-slate-800 text-xs truncate" id="user_name">
                            John Doe
                        </h4>
                        <p class="text-[11px] text-slate-400 font-mono" id="user_department">
                            Human Resources
                        </p>
                    </div>
    
                    <!-- 3rd item: Right-aligned button -->
                    <div class="shrink-0 ml-auto">
                        <button type="button" id="userExpandDetails"
                            class="w-7 h-7 rounded-lg bg-slate-100 text-slate-500 hover:bg-indigo-50 hover:text-indigo-600 transition-colors inline-flex items-center justify-center">
                            <i class="bi bi-chevron-down text-xs" id="userExpandDetailsIcon"></i>
                        </button>
                    </div>
                </div>
            </div>
    
            <!-- Collapsible Details Wrapper (Hidden by default) -->
            <div class="hidden overflow-hidden transition-[height] duration-300 ease-in-out" id="userDetailsWrapper">
            
                <div class="px-5 pb-5 pt-3 border-t border-slate-200/60 bg-slate-50/70 space-y-4" id="userDetailsContainer">
            
                    <!-- Header Title inside expanded wrapper -->
                    <div
                        class="flex items-center justify-between pb-2 border-b border-slate-200/60 text-xs font-bold text-slate-700">
                        <span>Account and Actions</span>
                    </div>
            
                    <!-- Account Credentials & Status Grid (Flat Layout) -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                        <div>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Username</span>
                            <span class="font-mono text-slate-800 font-medium mt-0.5 block" id="user_username">johndoe123</span>
                        </div>
                        <div>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Password</span>
                            <span class="font-mono text-slate-400 mt-0.5 block" id="user_password">••••••••</span>
                        </div>
                        <div>
                            <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider block">Status</span>
                            <div class="mt-1">
                                <!-- Active Badge -->
                                <span id="user_status_badge_active"
                                    class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200/80 font-bold text-[10px] uppercase">
                                    <i class="bi bi-check-circle-fill text-[9px]"></i> Active
                                </span>
                                
                                <!-- Inactive Badge (Hidden) -->
                                <span id="user_status_badge_inactive"
                                    class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200/80 font-bold text-[10px] uppercase">
                                    <i class="bi bi-x-circle-fill text-[9px]"></i> Inactive
                                </span>
                                
                                <!-- Pending Badge (Hidden) -->
                                <span id="user_status_badge_pending"
                                    class="hidden inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80 font-bold text-[10px] uppercase">
                                    <i class="bi bi-clock-fill text-[9px]"></i> Pending
                                </span>
                            </div>
                        </div>
                    </div>
            
                    <!-- Action Buttons (Icons ONLY on Edit and Delete) -->
                    <div class="pt-3 border-t border-slate-200/60 flex flex-wrap items-center justify-end gap-2">
                    
                        <!-- Activate Button -->
                        <button type="button" id="btnActivateUser"
                            class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 text-xs font-semibold transition-colors active:scale-95">
                            <i class="bi bi-check-circle-fill text-xs"></i>
                            <span>Activate</span>
                        </button>
                    
                        <!-- Deactivate Button -->
                        <button type="button" id="btnDeactivateUser"
                            class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200/80 text-xs font-semibold transition-colors active:scale-95">
                            <i class="bi bi-slash-circle-fill text-xs"></i>
                            <span>Deactivate</span>
                        </button>
                    
                        <!-- Delete Button -->
                        <button type="button" id="btnDeleteUser"
                            class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200/80 text-xs font-semibold transition-colors active:scale-95">
                            <i class="bi bi-trash-fill text-xs"></i>
                            <span>Delete</span>
                        </button>
                    
                    </div>
            
                </div>
            </div>
    
        </div>
    
    </div>
</div>
